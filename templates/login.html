{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block main %}<section class="wrap sec page narrow"><h1 class="h2">Sign in</h1>
{% if ok %}<p class="ok">{{ ok }}</p>{% endif %}
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Password<input type="password" name="password" autofocus required autocomplete="current-password"></label>
{% if err %}<p class="err">{{ err }}</p>{% endif %}<button class="btn">Sign in</button></form>
<p class="note"><a href="{{ url_for('forgot') }}">Forgot password?</a></p></section>{% endblock %}
