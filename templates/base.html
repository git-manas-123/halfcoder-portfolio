<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}HalfCoder | Manas Ranjan Sahu, DevOps & Linux Portfolio{% endblock %}</title>
<meta name="description" content="{% block desc %}HalfCoder is the DevOps portfolio of Manas Ranjan Sahu, an RHCSA-certified Linux system administrator: Ubuntu hosting, Nginx, SSL, AWS, Docker, Kubernetes and CI/CD.{% endblock %}">
<link rel="canonical" href="{{ request.url_root.rstrip('/') }}{{ request.path }}">
<meta name="author" content="Manas Ranjan Sahu">
<meta property="og:site_name" content="Manas Ranjan Sahu"><meta property="og:locale" content="en_IN">
<meta property="og:type" content="{% block ogtype %}website{% endblock %}">
<meta property="og:title" content="{{ self.title()|striptags }}"><meta property="og:description" content="{{ self.desc()|striptags }}">
<meta property="og:url" content="{{ request.url_root.rstrip('/') }}{{ request.path }}">
<meta property="og:image" content="{{ url_for('static', filename='profile.jpg', _external=True) }}">
<meta name="twitter:card" content="summary">
{% if gsc %}<meta name="google-site-verification" content="{{ gsc }}">{% endif %}
<script>document.documentElement.dataset.theme=localStorage.getItem("theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% block head %}{% endblock %}
</head><body>
<canvas id="scene" aria-hidden="true"></canvas>
<canvas id="bg2" aria-hidden="true" hidden></canvas>
<div id="aurora" aria-hidden="true" hidden><i></i><i></i><i></i></div>
<header class="nav"><div class="wrap navin">
  <a class="logo" href="{{ url_for('home') }}">HalfCoder</a>
  <nav>
    <a href="{{ url_for('about') }}"{% if request.endpoint=='about' %} class="on" aria-current="page"{% endif %}>About</a>
    <a href="{{ url_for('work') }}"{% if request.endpoint=='work' %} class="on" aria-current="page"{% endif %}>Work</a>
    <a href="{{ url_for('experience') }}"{% if request.endpoint=='experience' %} class="on" aria-current="page"{% endif %}>Experience</a>
    <a href="{{ url_for('skills') }}"{% if request.endpoint=='skills' %} class="on" aria-current="page"{% endif %}>Skills</a>
<a href="{{ url_for('resume') }}"{% if request.endpoint=='resume' %} class="on" aria-current="page"{% endif %}>Resume</a>
    <a href="{{ url_for('vlogs') }}"{% if request.endpoint=='vlogs' %} class="on" aria-current="page"{% endif %}>Vlogs</a>
    <a href="{{ url_for('contact') }}"{% if request.endpoint=='contact' %} class="on" aria-current="page"{% endif %}>Contact</a>
    {% if admin %}<a href="{{ url_for('admin') }}">Admin</a>{% endif %}
    <button id="bgbtn" class="icbtn" type="button" aria-label="Change background"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/></svg></button>
    <button id="theme" type="button" aria-label="Switch between light and dark theme"><span class="dot"><svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></button>
  </nav>
</div></header>
<main>{% block main %}{% endblock %}</main>
<button id="monkey" class="monkey" type="button" aria-label="Release the Chaos Monkey"><em>🐒</em><span>Release the Chaos Monkey</span></button>
<footer class="wrap foot">© 2026 Manas Ranjan Sahu <span id="up" class="note"></span></footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='scene.js') }}"></script>
<script src="{{ url_for('static', filename='fun.js') }}"></script>
<script src="{{ url_for('static', filename='bg.js') }}"></script>
<script>
document.getElementById("theme").onclick=()=>{const r=document.documentElement,t=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=t;localStorage.setItem("theme",t);dispatchEvent(new Event("themechange"))}
</script>
<script>const tl=document.querySelector(".tilt");if(tl&&!matchMedia("(prefers-reduced-motion: reduce)").matches)addEventListener("pointermove",e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;tl.style.transform=`perspective(700px) rotateY(${x*14}deg) rotateX(${-y*14}deg)`})</script>
{% block scripts %}{% endblock %}
</body></html>
