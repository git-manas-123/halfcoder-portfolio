{% extends "base.html" %}{% block title %}{{ 'Edit vlog' if v else 'New vlog' }}{% endblock %}
{% block main %}<section class="wrap sec page"><h1 class="h2">{{ 'Edit vlog' if v else 'New vlog' }}</h1>
{% if saved %}<p class="ok">Saved.</p>{% endif %}
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>Title<input name="title" value="{{ v.title if v }}" required></label>
<label>Summary<input name="summary" value="{{ v.summary if v }}" maxlength="200"></label>
<div class="split"><label>Write in Markdown<textarea id="body" name="body" rows="22">{{ v.body if v }}</textarea></label>
<div><span class="lbl">Preview</span><div id="pv" class="prose panel"></div></div></div>
<label class="chk"><input type="checkbox" name="published" {{ 'checked' if (not v) or v.published }}> Show on the site</label>
<p class="cta"><button class="btn">Save vlog</button> <a class="btn ghost" href="{{ url_for('admin') }}">Back to list</a></p></form></section>{% endblock %}
{% block scripts %}<script>
const b=document.getElementById("body"),pv=document.getElementById("pv");let t;
async function up(){const f=new FormData();f.append("body",b.value);const r=await fetch("{{ url_for('preview') }}",{method:"POST",body:f,headers:{"X-CSRF":"{{ csrf }}"}});pv.innerHTML=(await r.json()).html}
b.oninput=()=>{clearTimeout(t);t=setTimeout(up,300)};up();
</script>{% endblock %}
