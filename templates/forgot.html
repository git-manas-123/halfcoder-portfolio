{% extends "base.html" %}{% block title %}Forgot password{% endblock %}
{% block main %}<section class="wrap sec page narrow"><h1 class="h2">Forgot password</h1>
<p class="note">I'll email a 6-digit code to the admin address. It works for 10 minutes.</p>
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf }}">
{% if err %}<p class="err">{{ err }}</p>{% endif %}<button class="btn">Email me a code</button></form>
<p class="note"><a href="{{ url_for('reset') }}">I already have a code</a> &middot; <a href="{{ url_for('login') }}">Back to sign in</a></p></section>{% endblock %}
