{% extends "base.html" %}{% block title %}Reset password{% endblock %}
{% block main %}<section class="wrap sec page narrow"><h1 class="h2">Reset password</h1>
<form method="post" class="form"><input type="hidden" name="csrf" value="{{ csrf }}">
<label>6-digit code from the email<input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required autofocus></label>
<label>New password (10+ characters)<input type="password" name="password" minlength="10" autocomplete="new-password" required></label>
<label>Confirm new password<input type="password" name="confirm" minlength="10" autocomplete="new-password" required></label>
{% if err %}<p class="err">{{ err }}</p>{% endif %}<button class="btn">Set new password</button></form>
<p class="note"><a href="{{ url_for('forgot') }}">Send a new code</a> &middot; <a href="{{ url_for('login') }}">Back to sign in</a></p></section>{% endblock %}
